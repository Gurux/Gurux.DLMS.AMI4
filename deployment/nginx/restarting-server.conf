# Include this file inside the existing AMI server block.
# Install these files outside the AMI process/container before enabling this include.
proxy_intercept_errors on;
error_page 502 503 504 =503 @ami_restarting;

location @ami_restarting {
    if ($ami_restart_navigation) {
        rewrite ^ /_restarting/index.html last;
    }
    add_header Cache-Control "no-store" always;
    add_header Retry-After "2" always;
    return 503;
}

location ^~ /_restarting/ {
    alias /var/www/gurux-ami-restarting/;
    types {
        text/html html;
        text/javascript js;
        text/css css;
        application/xml resx;
    }
    add_header Cache-Control "no-store" always;
    add_header Retry-After "2" always;
}
