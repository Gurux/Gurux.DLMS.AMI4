name: AMI regression checks

on:
  pull_request:
    paths:
      - 'Gurux.DLMS.AMI/**'
      - 'Gurux.DLMS.AMI.Shared/**'
      - 'Gurux.DLMS.AMI.Module/**'
      - 'Tests/Module/**'
      - 'Gurux.DLMS.AMI.Http/**'
      - 'Gurux.DLMS.AMI.Tests/**'
      - '.github/workflows/ami-checks.yml'
  push:
    branches: [main]
    paths:
      - 'Gurux.DLMS.AMI/**'
      - 'Gurux.DLMS.AMI.Shared/**'
      - 'Gurux.DLMS.AMI.Module/**'
      - 'Tests/Module/**'
      - 'Gurux.DLMS.AMI.Http/**'
      - 'Gurux.DLMS.AMI.Tests/**'
      - '.github/workflows/ami-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ami-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Gurux/Gurux.DLMS.UI.Components
          ref: ${{ vars.AMI_DLMS_UI_COMPONENTS_REF || 'main' }}
          path: _dependencies/dlms-ui
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate Module public API compatibility
        shell: pwsh
        run: >-
          dotnet pack Gurux.DLMS.AMI.Module/Gurux.DLMS.AMI.Module.csproj
          --configuration Release -p:GeneratePackageOnBuild=false
      - name: Run project-local Module tests and contract-major guard
        shell: pwsh
        run: >-
          dotnet test Tests/Module/Module.Tests.slnx
          --configuration Release -m:1 -p:GeneratePackageOnBuild=false
          -p:GuruxDlmsUiComponentsSourceProject=${{ github.workspace }}/_dependencies/dlms-ui/Development/Gurux.DLMS.UI.Components.csproj
          --logger trx --results-directory Tests/Module/TestResults
      - name: Run server and client regression checks
        shell: pwsh
        run: >-
          ./Gurux.DLMS.AMI.Tests/scripts/Invoke-Tests.ps1
          -DlmsUiSourceProject _dependencies/dlms-ui/Development/Gurux.DLMS.UI.Components.csproj
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ami-test-results
          path: |
            Gurux.DLMS.AMI.Tests/TestResults/*.trx
            Tests/Module/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
